amcl:
  ros__parameters:
    use_sim_time: false

    # Frames / topics
    scan_topic: /scan
    odom_frame_id: odom
    base_frame_id: base_link
    global_frame_id: map

    # Publish map -> odom
    tf_broadcast: true
    transform_tolerance: 1.0

    # Motion model
    # AMCL supports plugin-based motion models; differential is the standard non-holonomic choice.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Odometry noise
    alpha1: 1.2
    alpha2: 0.4
    alpha3: 0.5
    alpha4: 0.8
    alpha5: 0.2

    # Particle filter size
    min_particles: 2000
    max_particles: 6000
    kld_err: 0.05
    kld_z: 0.99

    # Update thresholds
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1

    # Laser model
    laser_model_type: "likelihood_field"
    max_beams: 120
    laser_min_range: 0.20
    laser_max_range: 12.0
    sigma_hit: 0.1
    z_hit: 0.80
    z_max: 0.05
    z_rand: 0.05
    laser_likelihood_max_dist: 0.8

    # Initial pose handling
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    # Misc
    save_pose_rate: 0.5

    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.7
